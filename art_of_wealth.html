                voiceText: "火攻篇第十二：警惕成功经验的反噬效应。上一个周期的获利范式，往往演变为下一个周期的亏损根源。市场在进化，您的认知亦须同步迭代。牛市环境中的超额收益，并不等同于个人投资能力的印证。当宏观底座发生范式迁移，固守过往成功模式无异于刻舟求剑。"

            {

                desc: "防守的品质，决定了您在这个市场上存续的年限。全球顶级私人银行的共识是：防御性设计远较进攻性策略更具代际价值。完整经历一轮牛熊周期的洗礼，方能真正领悟投资的本质。\n\n然而，财富管理的终极境界，在于看清那些超越金钱本身的能力——对时间的敬畏、对风险的谦卑、对情绪的掌控、以及对长期主义的信仰。这些品质，才是真正不可被市场剥夺的核心资产。\n\n【今日行动】从十三篇心法中择取您认为最难践行的一条，誊写于便签并粘贴于每日复盘之处。一个月后，更换下一条。",
                voiceText: "终篇：活下去，才有复利。资本市场的残酷真相在于，它不奖赏最聪慧的参与者，而是馈赠存活最久的长青者。防守的品质，决定了您在这个市场上存续的年限。全球顶级私人银行的共识是，防御性设计远较进攻性策略更具代际价值。完整经历一轮牛熊周期的洗礼，方能真正领悟投资的本质。然而，财富管理的终极境界，在于看清那些超越金钱本身的能力，对时间的敬畏、对风险的谦卑、对情绪的掌控、以及对长期主义的信仰。这些品质，才是真正不可被市场剥夺的核心资产。"

        // 状态管理
        let currentIndex = 0;
        let isPlaying = false;
        let isHudVisible = true;
        let currentVoice = 'zh-CN-YunjianNeural';
        let currentSpeed = 0.95;

        const audioA = new Audio();
        const audioB = new Audio();
        let activeRoute = 'A';

        const canvas916 = document.getElementById('canvas916');
        const mainCard = document.getElementById('mainCard');
        const cardSeq = document.getElementById('cardSeq');
        const cardTitle = document.getElementById('cardTitle');
        const cardHook = document.getElementById('cardHook');
        const cardDesc = document.getElementById('cardDesc');
        const hudProgress = document.getElementById('hudProgress');
        const hudOverlay = document.getElementById('hudOverlay');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnToggleHud = document.getElementById('btnToggleHud');
        const sliderSpeed = document.getElementById('sliderSpeed');
        const txtSpeed = document.getElementById('txtSpeed');
        const selectVoice = document.getElementById('selectVoice');
        const matrixGrid = document.getElementById('matrixGrid');
        const unlockLockout = document.getElementById('unlockLockout');

        function getTtsUrl(text, voice) {
            return `https://libretts.is-an.org/api/tts?t=${encodeURIComponent(text)}&v=${voice}`;
        }

        function getCardText(index) {
            return SCRIPT_DATA[index].voiceText;
        }

        function renderCard(index) {
            const data = SCRIPT_DATA[index];
            mainCard.classList.remove('scale-100', 'opacity-100');
            mainCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                cardSeq.innerText = data.seq;
                cardTitle.innerText = data.title;
                cardHook.innerText = data.hook;
                cardDesc.innerHTML = data.desc.replace(/\n\n/g, '<br><br>');
                mainCard.classList.remove('scale-95', 'opacity-0');
                mainCard.classList.add('scale-100', 'opacity-100');
            }, 70);
            hudProgress.innerText = `心法 ${String(index + 1).padStart(2, '0')} / 15`;
            document.querySelectorAll('.matrix-item').forEach((item, idx) => {
                if (idx === index) {
                    item.classList.remove('bg-neutral-900', 'text-neutral-500', 'border-neutral-800');
                    item.classList.add('bg-[#D4AF37]', 'text-black', 'border-[#D4AF37]', 'scale-105');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    item.classList.remove('bg-[#D4AF37]', 'text-black', 'border-[#D4AF37]', 'scale-105');
                    item.classList.add('bg-neutral-900', 'text-neutral-500', 'border-neutral-800');
                }
            });
        }

        function playStep(index) {
            if (!isPlaying) return;
            currentIndex = index;
            renderCard(currentIndex);
            const activeAudioElem = (activeRoute === 'A') ? audioA : audioB;
            const nextAudioElem = (activeRoute === 'A') ? audioB : audioA;
            const nextIndex = (currentIndex + 1) % SCRIPT_DATA.length;
            const nextRoute = (activeRoute === 'A') ? 'B' : 'A';
            activeAudioElem.playbackRate = currentSpeed;
            const targetUrl = getTtsUrl(getCardText(currentIndex), currentVoice);
            if (activeAudioElem.src !== targetUrl) activeAudioElem.src = targetUrl;
            activeAudioElem.play().catch(err => console.log("音频播放:", err));
            nextAudioElem.src = getTtsUrl(getCardText(nextIndex), currentVoice);
            nextAudioElem.playbackRate = currentSpeed;
            nextAudioElem.load();
            activeAudioElem.onended = () => {
                if (!isPlaying) return;
                activeRoute = nextRoute;
                playStep(nextIndex);
            };
        }

        function pauseCruise() {
            isPlaying = false;
            audioA.pause();
            audioB.pause();
            btnPlayPause.innerHTML = `<svg class="w-3.5 h-3.5 fill-current text-brand-gold" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>开启巡航</span>`;
            btnPlayPause.classList.remove('border-brand-gold/60', 'text-brand-gold');
            btnPlayPause.classList.add('border-neutral-800', 'text-neutral-300');
        }

        function startCruise() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlayPause.innerHTML = `<svg class="w-3.5 h-3.5 fill-current text-brand-gold" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>暂停巡航</span>`;
            btnPlayPause.classList.remove('border-neutral-800', 'text-neutral-300');
            btnPlayPause.classList.add('border-brand-gold/60', 'text-brand-gold');
            playStep(currentIndex);
        }

        function initMatrixGrid() {
            matrixGrid.innerHTML = '';
            SCRIPT_DATA.forEach((item, idx) => {
                const btn = document.createElement('button');
                let displayNum = idx + 1;
                if (idx === 0) displayNum = "序";
                else if (idx === SCRIPT_DATA.length - 1) displayNum = "终";
                else displayNum = String(idx);
                btn.className = `matrix-item flex-none snap-center w-9 h-9 rounded-lg border text-xs font-mono font-bold flex items-center justify-center transition-all bg-neutral-900 text-neutral-500 border-neutral-800 active:scale-90`;
                btn.innerText = displayNum;
                btn.addEventListener('click', () => {
                    const wasPlaying = isPlaying;
                    pauseCruise();
                    currentIndex = idx;
                    renderCard(currentIndex);
                    audioA.src = "";
                    audioB.src = "";
                    activeRoute = 'A';
                    if (wasPlaying) startCruise();
                });
                matrixGrid.appendChild(btn);
            });
        }

        btnPlayPause.addEventListener('click', () => { if (isPlaying) pauseCruise(); else startCruise(); });
        btnToggleHud.addEventListener('click', () => {
            isHudVisible = !isHudVisible;
            if (isHudVisible) {
                hudOverlay.classList.remove('opacity-0');
                canvas916.classList.remove('rounded-none');
                canvas916.classList.add('rounded-2xl');
                btnToggleHud.innerText = "隐藏 HUD";
            } else {
                hudOverlay.classList.add('opacity-0');
                canvas916.classList.remove('rounded-2xl');
                canvas916.classList.add('rounded-none');
                btnToggleHud.innerText = "显示 HUD";
            }
        });
        sliderSpeed.addEventListener('input', (e) => {
            currentSpeed = parseFloat(e.target.value);
            txtSpeed.innerText = currentSpeed.toFixed(2) + 'x';
            audioA.playbackRate = currentSpeed;
            audioB.playbackRate = currentSpeed;
        });
        selectVoice.addEventListener('change', (e) => {
            currentVoice = e.target.value;
            const wasPlaying = isPlaying;
            pauseCruise();
            audioA.src = "";
            audioB.src = "";
            if (wasPlaying) startCruise();
        });
        unlockLockout.addEventListener('click', () => {
            unlockLockout.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => unlockLockout.remove(), 200);
            audioA.src = getTtsUrl(getCardText(0), currentVoice);
            audioA.play().then(() => startCruise()).catch(() => startCruise());
        });
        document.addEventListener('touchmove', (e) => { if(e.touches.length > 1) e.preventDefault(); }, { passive: false });
        initMatrixGrid();
        renderCard(0);
    </script>
</body>
</html>
