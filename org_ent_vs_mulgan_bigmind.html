<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反馈协议：组织演化的系统动力学</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono&display=swap');
        
        body { 
            background-color: #050505; 
            color: #d1d5db; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        .slide { 
            display: none; 
            height: 100vh; 
            width: 100vw; 
            align-items: center; 
            justify-content: center; 
            padding: 1.5rem; 
            position: absolute;
            opacity: 0; 
            transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .slide.active { 
            display: flex; 
            opacity: 1; 
            transform: translateY(0);
        }

        .formula-box { 
            background: #0f172a; 
            border-left: 6px solid #3b82f6; 
            padding: 1.5rem; 
            border-radius: 0.5rem; 
            margin-top: 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1);
        }
        
        .token { color: #60a5fa; font-family: 'JetBrains Mono', monospace; }
        
        /* 响应式SVG样式 */
        .mind-map-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .node { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; }
        .text { fill: #e2e8f0; font-family: 'Inter'; font-size: 14px; font-weight: 600; pointer-events: none; }
        .line { stroke: #475569; stroke-width: 2; fill: none; }
        .arrowhead { fill: #475569; }
    </style>
</head>
<body class="flex flex-col items-center justify-center">

    <div id="presentation-container" class="w-full max-w-5xl cursor-pointer">
        
        <div class="slide active" id="slide-0">
            <div class="text-center">
                <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tighter text-white">反馈协议</h1>
                <p class="text-xl md:text-3xl text-gray-500 font-light">系统控制论视角下的组织生存手册</p>
            </div>
        </div>

        <div class="slide" id="slide-1">
            <div class="max-w-3xl">
                <h2 class="text-4xl font-bold mb-10 text-gray-100">传统管理的虚无</h2>
                <ul class="space-y-6 text-xl md:text-2xl text-gray-400">
                    <li class="flex items-start">→ <span class="ml-4">大多数管理理论是披着“结构化建议”外衣的叙事小说。</span></li>
                    <li class="flex items-start">→ <span class="ml-4">我们需要的是“反馈回路”，而非更多的“团队愿景”。</span></li>
                    <li class="flex items-start">→ <span class="ml-4">停止“希望驱动的韧性”，构建“证据驱动的稳定”。</span></li>
                </ul>
            </div>
        </div>

        <div class="slide" id="slide-2">
            <div class="w-full max-w-4xl">
                <h2 class="text-2xl md:text-3xl font-bold mb-4 text-gray-100 tracking-tight">组织竞争力的底层法则</h2>
                <div class="formula-box text-lg md:text-2xl font-mono">
                    <span class="text-white">竞争力</span> = 
                    <span class="token">输入</span> + (<span class="token">智商</span> × <span class="token">反馈</span>) - <span class="token">外泄</span>
                </div>
            </div>
        </div>

        <div class="slide" id="slide-3">
            <div class="w-full max-w-4xl flex flex-col items-center">
                <h2 class="text-2xl md:text-3xl font-bold mb-6 text-gray-100">系统架构思维导图</h2>
                <div class="mind-map-container">
                    <svg viewBox="0 0 800 400" class="w-full h-auto">
                        <defs>
                            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                                <polygon points="0 0, 10 3.5, 0 7" class="arrowhead"/>
                            </marker>
                        </defs>
                        <!-- 中心节点 -->
                        <rect x="300" y="150" width="200" height="60" rx="10" class="node" style="stroke: #3b82f6; stroke-width: 3;"/>
                        <text x="400" y="185" text-anchor="middle" class="text" style="font-size: 18px; fill: white;">组织竞争力</text>
                        
                        <!-- 输入流 -->
                        <line x1="150" y1="100" x2="300" y2="160" class="line" marker-end="url(#arrowhead)"/>
                        <rect x="50" y="70" width="100" height="40" rx="5" class="node"/>
                        <text x="100" y="95" text-anchor="middle" class="text">输入</text>

                        <!-- 转化引擎 -->
                        <line x1="400" y1="50" x2="400" y2="150" class="line" marker-end="url(#arrowhead)"/>
                        <rect x="350" y="10" width="100" height="40" rx="5" class="node"/>
                        <text x="400" y="35" text-anchor="middle" class="text">转化引擎</text>
                        
                        <!-- 熵增流出 -->
                        <line x1="500" y1="160" x2="650" y2="100" class="line" marker-end="url(#arrowhead)"/>
                        <rect x="650" y="70" width="100" height="40" rx="5" class="node"/>
                        <text x="700" y="95" text-anchor="middle" class="text" style="fill: #f87171;">熵增(外泄)</text>
                        
                        <!-- 反馈网络 -->
                        <line x1="400" y1="300" x2="400" y2="210" class="line" marker-end="url(#arrowhead)"/>
                        <rect x="300" y="300" width="200" height="40" rx="5" class="node"/>
                        <text x="400" y="325" text-anchor="middle" class="text">人机共治协议</text>
                    </svg>
                </div>
            </div>
        </div>

        <div class="slide" id="slide-4">
            <div class="max-w-2xl text-center">
                <h2 class="text-4xl md:text-5xl font-bold mb-8 text-red-500 tracking-tight">不可达的完美</h2>
                <p class="text-xl md:text-2xl text-gray-200 mb-8 leading-relaxed">
                    “架构师的职责不是追求完美，而是构建一套协议，确保在反馈失效的真空期，系统能够自发维持韧性。”
                </p>
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function updateSlides() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlides();
            } else if (e.key === 'ArrowLeft' && currentSlide > 0) {
                currentSlide--;
                updateSlides();
            }
        });

        document.getElementById('presentation-container').addEventListener('click', () => {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlides();
            } else {
                currentSlide = 0;
                updateSlides();
            }
        });
    </script>
</body>
</html>
