<!DOCTYPE html>
<html lang="zh-CN" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2026 顶级 Agent 框架大盘点 - 录屏大字报</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonGreen: '#39FF14',
                        neonYellow: '#FFFF00',
                        neonOrange: '#FF5F1F',
                    },
                }
            }
        }
    </script>
    <style>
        /* 强制竖屏锁死与极致录屏环境准备 */
        html, body { 
            background-color: #000000; 
            overflow: hidden; 
            width: 100%; 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-user-select: none; 
            overscroll-behavior: none; 
        }
        ::-webkit-scrollbar { 
            display: none; 
        }
        .card-container { 
            perspective: 1000px; 
        }
        /* 140ms 极速闪切与物理弹性回弹 */
        .card-transition { 
            transition: transform 140ms cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 140ms ease-out; 
        }
        .card-exit { 
            transform: translate(-40px, -20px) rotate(-2deg) scale(0.92); 
            opacity: 0; 
            pointer-events: none; 
        }
        .card-enter-prep { 
            transform: translate(50px, 30px) rotate(3deg) scale(0.95); 
            opacity: 0; 
            pointer-events: none; 
        }
        .card-active { 
            transform: translate(0, 0) rotate(0deg) scale(1); 
            opacity: 1; 
            pointer-events: auto; 
        }
        
        /* 音频波动动画 */
        .wave-bar { 
            display: inline-block; 
            width: 3px; 
            height: 10px; 
            background-color: #FFFF00; 
            margin: 0 1px; 
            animation: bounce 0.6s infinite alternate; 
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        @keyframes bounce { 
            from { height: 4px; } 
            to { height: 16px; } 
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-white relative">

    <div class="absolute inset-0 bg-black z-0"></div>

    <!-- 隐藏式 HTML5 高保真音频播放器 -->
    <audio id="global-audio-player" class="hidden" preload="auto" playsinline></audio>

    <!-- 顶层遮罩：100% 激活移动端浏览器音频物理通道 -->
    <div id="audio-unlocker-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/98 px-6 text-center">
        <div class="w-full max-w-xs bg-zinc-950 border border-zinc-800 rounded-2xl p-6 shadow-2xl flex flex-col items-center">
            <span class="text-4xl mb-3 animate-bounce">🎙️</span>
            <h2 class="text-sm font-black text-white tracking-wide">2026 云端神经网络配音版</h2>
            <p class="text-zinc-400 text-[11px] mt-2 mb-5 leading-relaxed">
                已成功接入高保真云端神经网络语音服务。原生完美支持中英混读，男声浑厚磁性，女声甜美专业。
            </p>
            <button id="force-active-btn" class="w-full bg-neonYellow text-black font-black py-3 rounded-xl text-xs tracking-widest active:scale-95 transition-transform shadow-lg shadow-yellow-500/10">
                🚀 激活高品质云端配音
            </button>
        </div>
    </div>

    <!-- 顶层录制主容器（画面展示为中英混排高大上排版） -->
    <main id="main-click-area" class="w-full h-full max-w-md flex flex-col justify-between px-6 pt-12 pb-24 z-10 relative cursor-pointer">
        <header class="w-full flex justify-between items-center text-xs text-zinc-600">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
                <span class="tracking-widest font-mono">REC 9:16 PORTRAIT</span>
            </div>
            <div class="font-mono" id="hud-counter">1 / 9</div>
        </header>

        <!-- 卡片限高 420px，确保录制时刘海屏与边缘不受拉伸遮挡 -->
        <div class="card-container w-full flex items-center justify-center my-auto" style="height: 420px;">
            <div id="card-element" class="card-transition card-active w-full bg-zinc-950/40 border border-zinc-900 rounded-2xl p-6 flex flex-col justify-between shadow-2xl relative overflow-hidden" style="height: 100%;">
                <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.01)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.01)_1px,transparent_1px)] bg-[size:20px_20px] pointer-events-none"></div>
                <div>
                    <span id="card-tag" class="text-neonYellow font-black tracking-widest text-xs uppercase bg-neonYellow/10 px-3 py-1 rounded">2026 TRENDS</span>
                    <h1 id="card-title" class="text-3xl font-black text-white tracking-tight mt-5 leading-tight">AI Agent 选型</h1>
                </div>
                <div id="card-hook-box" class="border-l-8 border-neonOrange bg-neonOrange/10 pl-4 py-3 my-3">
                    <p id="card-hook" class="text-lg font-black text-white leading-snug">别再瞎选了！官方发布终极指南</p>
                </div>
                <div><p id="card-desc" class="text-zinc-400 text-xs leading-relaxed font-medium">一文看清 最强 AI Agent 引擎！</p></div>
            </div>
        </div>

        <footer class="w-full flex flex-col items-center gap-3 z-10">
            <p class="text-zinc-600 text-xs tracking-widest text-center animate-pulse">👇 点击屏幕任意位置「瞬切下一页」</p>
        </footer>
    </main>

    <!-- 底部抽屉控制面板 -->
    <div id="recording-controller" class="fixed bottom-0 left-1/2 -translate-x-1/2 z-40 bg-zinc-950/98 border-t border-x border-zinc-800 rounded-t-2xl flex flex-col shadow-2xl transition-all duration-300 w-full max-w-md translate-y-[calc(100%-36px)]">
        
        <button onclick="toggleController(event)" class="w-full h-9 flex items-center justify-between px-6 bg-zinc-900 rounded-t-2xl border-b border-zinc-800/80 active:bg-zinc-800 transition-colors">
            <div class="flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-neonYellow animate-ping"></span>
                <span class="text-[11px] font-black tracking-widest text-zinc-300 font-mono">🎙️ 2026 神经网络配音与提词控制台</span>
            </div>
            <span id="controller-arrow" class="text-xs text-zinc-500 font-bold transition-transform duration-300">▲ 点击展开面板</span>
        </button>

        <div class="p-5 flex flex-col gap-4 text-xs">
            <!-- 实时语音波动指示器 -->
            <div class="bg-zinc-900 border border-zinc-800 p-3 rounded-lg flex flex-col gap-1">
                <div class="flex justify-between items-center text-[10px] text-neonYellow font-mono font-bold">
                    <span class="flex items-center gap-1">
                        📢 实时高保真口播文本
